<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AuraShield</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="head">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">&#128737;</span>
      <span class="brand-name">AuraShield</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="master-toggle" />
      <span class="switch-track"><span class="switch-thumb"></span></span>
    </label>
  </header>

  <section class="stat-row">
    <span class="stat-num" id="stat-count">0</span>
    <span class="stat-label">items shielded today</span>
  </section>

  <section class="site-row" id="site-row" hidden>
    <span class="site-label">Shield on <strong id="site-host"></strong></span>
    <label class="switch">
      <input type="checkbox" id="site-toggle" />
      <span class="switch-track"><span class="switch-thumb"></span></span>
    </label>
  </section>

  <section class="ai-status" id="ai-status">
    <p class="ai-status-text" id="ai-status-text">Checking on-device AI…</p>
    <button type="button" class="btn-primary" id="ai-enable-btn" hidden>Enable on-device AI</button>
    <progress class="ai-progress" id="ai-progress" max="100" value="0" hidden></progress>
  </section>

  <section class="categories" aria-label="Quick category toggles">
    <h2 class="section-title">Shield categories</h2>
    <ul class="category-list" id="category-list"></ul>
  </section>

  <footer class="foot">
    <button type="button" class="btn-link" id="open-options">Manage categories &amp; intensity</button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
